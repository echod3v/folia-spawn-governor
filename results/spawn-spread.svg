<text x="336.8" y="80" font-size="11.5" fill="#cf222e">50 ms = 20 TPS budget</text>
<text x="240" y="111" font-size="12.5" text-anchor="end" fill="#1f2328">vanilla sim 6, spawn spread ±4500</text>
<rect x="250" y="98" width="140.7" height="20" rx="3" fill="#8c959f"/>
<text x="396.7" y="112" font-size="12" fill="#1f2328" stroke="#ffffff" stroke-width="4" paint-order="stroke">87 ms · 11.5 TPS</text>
