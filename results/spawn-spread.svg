<svg xmlns="http://www.w3.org/2000/svg" width="760" height="278" viewBox="0 0 760 278" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="600" fill="#1f2328">Spreading players beats shrinking distances</text>
<text x="20" y="50" font-size="12.5" fill="#59636e">60 bots at uniform random positions · worst region average tick time</text>
